services:
  postgres:
    image: postgres:16-alpine
    container_name: uprank-dashboard-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: uprank
      POSTGRES_PASSWORD: uprank
      POSTGRES_DB: uprank_dashboard
    volumes:
      - uprank_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uprank -d uprank_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  uprank_pg_data:
